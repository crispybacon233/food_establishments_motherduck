[project]
name = "ducklake"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "dagster==1.13.1",
    "dagster-dbt>=0.29.1",
    "dbt-core>=1.11.8",
    "dbt-duckdb>=1.10.1",
    "gcsfs>=2026.3.0",
    "marimo>=0.23.1",
    "playwright>=1.58.0",
    "polars>=1.40.0",
    "python-dotenv>=1.2.2",
    "s3fs>=2026.3.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "ducklake"
registry_modules = [
    "ducklake.components.*",
]


