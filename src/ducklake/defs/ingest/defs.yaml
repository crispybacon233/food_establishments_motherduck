type: dagster.PythonScriptComponent
attributes:
  execution:
    path: refresh_inspections.py
  assets:
    - key: refresh_inspections
      description: "Refresh the inspections table"

---

type: dagster.PythonScriptComponent
attributes:
  execution:
    path: enrich_establishment_data.py
  assets:
    - key: enrich_establishment_data
      description: "Enrich the establishment data"
      deps: ["stg_inspections", "stg_establishments"]

---

type: dagster.PythonScriptComponent
attributes:
  execution:
    path: int_establishments.py
  assets:
    - key: int_establishments
      description: "Create the establishments view in the motherduck source schema"
      deps: ["enrich_establishment_data"]

---

type: dagster.PythonScriptComponent
attributes:
  execution:
    path: output_files.py
  assets:
    - key: output_files
      description: "Create the output files"
      deps: ["int_establishments", "stg_inspections"]
